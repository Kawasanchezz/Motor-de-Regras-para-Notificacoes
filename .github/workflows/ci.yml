name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissões mínimas: o workflow só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions fixadas por SHA completo (o comentário indica a versão); o Dependabot as atualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compila, valida regras do Enforcer e roda testes unitários e de integração (Testcontainers usa o Docker do runner).
      - name: Build e testes
        run: mvn -B verify
